{% load static %}

<html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>LitReview</title>
        <link rel="stylesheet" href="{% static 'users/style.css' %}" />
    </head>

    <body>
        <header class="navbar">
            <div class="nav-item">
                <nav><strong>LITReview</strong></nav>
            </div>
            <div class="nav-search">
                <form action="/search/" method="get" class="search-box">
                    <input type="search" name="q" placeholder="Search for a book..." aria-label="Search" required />
                    <button type="submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
            </div>
            <div class="nav-item">
                <nav><a href="{% url 'signup-page' %}">Sign up/login</a></nav>
            </div>
        </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    </body>
</html>
